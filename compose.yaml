name: saldo_academico
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saldo
      POSTGRES_DB: saldo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura .env}
    volumes:
      - saldo_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U saldo -d saldo]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      PORT: '8000'
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    mem_limit: 512m
volumes:
  saldo_data:
